name: Verify standalone release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test documented capabilities, race safety and release scanner
        run: |
          make verify
          make demo-scenario
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build standalone binary and docs
        run: |
          make build
          pip install -r requirements-docs.txt
          make docs
          git diff --exit-code -- docs/
      - name: Install free standalone secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan release files, generated docs and history
        run: |
          python3 scripts/check_release.py
          gitleaks git . --redact=100 --ignore-gitleaks-allow --no-banner
