<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Measured synthetic retrieval recall"><title>Measured synthetic retrieval recall</title><rect width="900" height="340" rx="16" fill="#f5f7f0"/><g font-family="system-ui,sans-serif" fill="#20382d"><text x="30" y="40" font-size="24" fill="#20382d">Retrieval diagnostic: mean recall@3</text><text x="30" y="68" font-size="15" fill="#20382d">12 authored synthetic queries; not LoCoMo, LongMemEval or answer accuracy.</text><text x="30" y="134" font-size="17" fill="#20382d">Recency baseline</text><rect x="245" y="110" width="135.0" height="34" rx="5" fill="#a5afa2"/><text x="795" y="134" font-size="18" fill="#20382d">25%</text><text x="30" y="199" font-size="17" fill="#20382d">BM25 keyword</text><rect x="245" y="175" width="405.0" height="34" rx="5" fill="#739a72"/><text x="795" y="199" font-size="18" fill="#20382d">75%</text><text x="30" y="264" font-size="17" fill="#20382d">Hybrid + Gemini</text><rect x="245" y="240" width="540" height="34" rx="5" fill="#337357"/><text x="795" y="264" font-size="18" fill="#20382d">100%</text><text x="30" y="320" font-size="14" fill="#20382d">See benchmarks/results/ for raw measurements, timestamps, models and dataset hash.</text></g></svg>
