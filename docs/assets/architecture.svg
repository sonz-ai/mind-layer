<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Mind Layer architecture"><title>Mind Layer architecture</title><rect width="900" height="340" rx="16" fill="#f5f7f0"/><g font-family="system-ui,sans-serif" fill="#20382d"><text x="30" y="40" font-size="24" fill="#20382d">Mind Layer: local ownership, optional model calls</text><rect x="30" y="85" width="245" height="76" rx="10" fill="white" stroke="#9eb4a0"/><text x="46" y="115" font-size="18" fill="#20382d">Your application</text><text x="46" y="140" font-size="13" fill="#20382d">REST client or character example</text><rect x="335" y="85" width="245" height="76" rx="10" fill="white" stroke="#9eb4a0"/><text x="351" y="115" font-size="18" fill="#20382d">Mind Layer</text><text x="351" y="140" font-size="13" fill="#20382d">Memory + retrieval + personality</text><rect x="640" y="85" width="225" height="76" rx="10" fill="white" stroke="#9eb4a0"/><text x="656" y="115" font-size="18" fill="#20382d">Local database</text><text x="656" y="140" font-size="13" fill="#20382d">Embedded Bolt; no server</text><path d="M275 123 H325" stroke="#337357" stroke-width="3"/><path d="M320 117 L330 123 L320 129" fill="none" stroke="#337357" stroke-width="3"/><path d="M580 123 H630" stroke="#337357" stroke-width="3"/><path d="M625 117 L635 123 L625 129" fill="none" stroke="#337357" stroke-width="3"/><rect x="335" y="220" width="320" height="76" rx="10" fill="white" stroke="#9eb4a0"/><text x="351" y="250" font-size="18" fill="#20382d">Your chosen model provider</text><text x="351" y="275" font-size="13" fill="#20382d">Optional embedding, extraction and replies</text><path d="M455 161 V212" stroke="#b36920" stroke-width="3" stroke-dasharray="5 4"/><text x="480" y="194" font-size="14" fill="#20382d">Direct API calls</text><text x="30" y="325" font-size="15" fill="#20382d">No Sonzai account, billing service, telemetry or license-server dependency.</text></g></svg>
